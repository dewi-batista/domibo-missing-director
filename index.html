<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>The Missing Director</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕵️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F0F4F8; --surface:#FFFFFF; --surface-alt:#EBF0F3; --ink:#1A2B4C; --ink-dim:#588098;
    --accent:#8B5CF6; --accent-strong:#7C3AED; --alert:#E03137; --gold:#A16207; --border:#D5DFE5;
    --tier1:#588098; --tier2:#FF385C; --tier3:#8B5CF6; --tier4:#A16207;
    --glow:none; --scan-op:.03;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F172A; --surface:#1A2B4C; --surface-alt:#31405E; --ink:#F0F4F8; --ink-dim:#9FC5E8;
      --accent:#8B5CF6; --accent-strong:#A27DF8; --alert:#FF385C; --gold:#F59E0B; --border:#3C4B67;
      --tier1:#588098; --tier2:#FF385C; --tier3:#8B5CF6; --tier4:#F59E0B;
      --glow:0 0 18px rgba(139,92,246,.28); --scan-op:.05;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F172A; --surface:#1A2B4C; --surface-alt:#31405E; --ink:#F0F4F8; --ink-dim:#9FC5E8;
    --accent:#8B5CF6; --accent-strong:#A27DF8; --alert:#FF385C; --gold:#F59E0B; --border:#3C4B67;
    --tier1:#588098; --tier2:#FF385C; --tier3:#8B5CF6; --tier4:#F59E0B;
    --glow:0 0 18px rgba(139,92,246,.28); --scan-op:.05;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--font-sans,'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif);
    min-height:100vh; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:560px;margin:0 auto;padding:20px 16px 56px;}
  .font-mono{font-family:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;}
  h1,h2,h3{text-wrap:balance;margin:0;}
  p{margin:0;}
  .hidden{display:none !important;}

  /* header */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;}
  .wordmark{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15px;letter-spacing:.06em;}
  .wordmark small{display:block;font-family:'IBM Plex Sans',sans-serif;font-weight:500;font-size:11px;letter-spacing:.12em;color:var(--ink-dim);text-transform:uppercase;margin-top:2px;}
  .iconbtn{
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.05em;
    background:var(--surface);border:1px solid var(--accent);color:var(--accent-strong);
    padding:8px 12px;border-radius:6px;cursor:pointer;text-transform:uppercase;
    box-shadow:0 0 8px color-mix(in srgb, var(--accent) 25%, transparent);
    transition:box-shadow .15s ease,filter .15s ease;
  }
  .iconbtn:hover,.iconbtn:active{
    box-shadow:0 0 12px color-mix(in srgb, var(--accent) 45%, transparent);
    filter:brightness(1.15);
  }
  .iconbtn:active{filter:brightness(1.3);}
  .iconbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* rank ladder */
  .ladder{display:flex;align-items:center;margin:0 0 20px;}
  .ladder .node{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;}
  .ladder .dot{width:14px;height:14px;border-radius:50%;background:var(--surface-alt);border:2px solid var(--border);}
  .ladder .node.done .dot{background:var(--tier-color);border-color:var(--tier-color);}
  .ladder .node.now .dot{background:var(--tier-color);border-color:var(--tier-color);box-shadow:var(--glow);}
  .ladder .bar{position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--border);z-index:-1;}
  .ladder .node:first-child .bar{display:none;}
  .ladder .node.done .bar,.ladder .node.now .bar{background:var(--tier-color);}
  .ladder .label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-dim);}
  .ladder .node.now .label,.ladder .node.done .label{color:var(--ink);}

  /* console card */
  .console{
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:20px;position:relative;overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,.06);
  }
  .console::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,var(--scan-op)) 0 1px,transparent 1px 3px);
  }
  .console-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:8px;flex-wrap:wrap;}
  .console-head.center{justify-content:center;}
  .console-head .status{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;letter-spacing:.08em;color:var(--tier-color,var(--accent));}
  .console-head .lvtitle{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;letter-spacing:.08em;color:var(--tier2);}
  .briefing{font-size:15px;color:var(--ink);margin-bottom:16px;}
  .verse{font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.7;color:var(--ink);white-space:pre-line;margin-bottom:16px;padding:12px 14px;background:var(--surface-alt);border-left:3px solid var(--tier-color,var(--accent));border-radius:4px;}
  .stepblock{font-family:'IBM Plex Mono',monospace;margin-bottom:20px;}
  .stepheading{font-weight:700;font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--tier-color,var(--accent));margin-bottom:10px;}
  .stepintro{font-size:14px;line-height:1.6;color:var(--ink);margin-bottom:10px;}
  .stepquote{font-size:13px;line-height:1.8;color:var(--ink);white-space:pre-line;padding-left:24px;margin-bottom:10px;}
  .steplist{font-size:13px;line-height:1.8;color:var(--ink);margin-bottom:10px;}
  .stepoutro{font-size:14px;line-height:1.6;color:var(--ink);}

  /* memo / physical-prop card */
  .memo{
    background:var(--surface-alt);border:1px dashed var(--border);border-radius:6px;
    padding:14px 16px;margin-bottom:16px;position:relative;
  }
  .memo .stamp{
    font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:10px;letter-spacing:.1em;
    color:var(--alert);border:1.5px solid var(--alert);border-radius:3px;padding:2px 8px;
    display:inline-block;transform:rotate(-3deg);margin-bottom:8px;
  }
  .memo p{font-size:13.5px;color:var(--ink-dim);}
  .memo ul{margin:8px 0 0;padding-left:18px;font-size:13.5px;color:var(--ink-dim);}
  .memo li{margin-bottom:4px;}
  .memo li b{color:var(--ink);}

  /* LV1 grid */
  .grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;max-width:320px;margin:0 auto 16px;}
  .grid6 .cell{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;
    background:var(--surface-alt);border:1px solid var(--border);border-radius:4px;color:var(--ink);
  }

  .rule{font-family:'IBM Plex Mono',monospace;font-size:12.5px;background:var(--surface-alt);border-radius:4px;padding:10px 12px;margin:10px 0 16px;color:var(--ink);}
  .noticebox{font-family:'IBM Plex Mono',monospace;font-size:12.5px;background:var(--surface-alt);border-radius:4px;padding:10px 12px;margin:10px 0 16px;color:var(--ink);line-height:1.8;}
  .noticehead{font-weight:700;letter-spacing:.05em;margin-bottom:4px;}
  .noticeitem{padding-left:4px;}

  /* input */
  .field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:6px;}
  .field .row{display:flex;gap:8px;}
  input[type=text]{
    flex:1;font-family:'IBM Plex Mono',monospace;font-size:16px;letter-spacing:.03em;
    background:var(--bg);border:1.5px solid var(--border);border-radius:6px;color:var(--ink);
    padding:12px 12px;text-transform:uppercase;min-width:0;
  }
  input[type=text]:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);}
  .btn{
    font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;letter-spacing:.05em;
    background:var(--tier-color,var(--accent));color:var(--surface);border:none;border-radius:6px;
    padding:0 18px;cursor:pointer;text-transform:uppercase;
    transition:filter .15s ease,box-shadow .15s ease;
  }
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .btn.secondary{background:transparent;border:1.5px solid var(--border);color:var(--ink);}
  /* Lit by default whenever a button is actually clickable */
  .btn:not(:disabled){
    filter:brightness(1.15);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--tier-color,var(--accent)) 20%, transparent),0 0 10px color-mix(in srgb, var(--tier-color,var(--accent)) 35%, transparent);
  }
  .btn:not(:disabled):hover,.btn:not(:disabled):active{filter:brightness(1.3);}
  .btn:not(:disabled):active{filter:brightness(1.4);}
  /* Exception: a submit-style button paired with an empty text field has nothing to act
     on yet, so it stays unlit until something is typed. */
  .row:has(input[type=text]:placeholder-shown) .btn:not(:disabled){
    filter:none;box-shadow:none;
  }
  .row:has(input[type=text]:placeholder-shown) .btn:not(:disabled):hover,
  .row:has(input[type=text]:placeholder-shown) .btn:not(:disabled):active{
    filter:brightness(1.1);
  }

  .feedback{margin-top:12px;font-family:'IBM Plex Mono',monospace;font-size:13px;padding:10px 12px;border-radius:6px;}
  .feedback.error{background:color-mix(in srgb, var(--alert) 12%, transparent);color:var(--alert);animation:shake .3s;}
  .feedback.success{background:color-mix(in srgb, var(--accent) 14%, transparent);color:var(--accent-strong);}
  @keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
  @media (prefers-reduced-motion: reduce){.feedback.error{animation:none;}}

  .footnote{margin-top:16px;font-size:12.5px;color:var(--ink-dim);font-style:italic;}

  /* team select */
  .teamcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:22px;text-align:center;}
  .teamcard h2{font-family:'IBM Plex Mono',monospace;font-size:18px;margin-bottom:6px;}
  .teamcard p{color:var(--ink-dim);font-size:14px;margin-bottom:18px;}
  .resume{margin-top:18px;padding-top:16px;border-top:1px solid var(--border);}
  .resume p{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim);margin-bottom:10px;}
  .chiplist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .chip{
    font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--surface-alt);
    border:1px solid var(--accent);border-radius:20px;padding:6px 14px;cursor:pointer;color:var(--ink);
    box-shadow:0 0 6px color-mix(in srgb, var(--accent) 20%, transparent);
    transition:box-shadow .15s ease,filter .15s ease;
  }
  .chip:hover,.chip:active{box-shadow:0 0 10px color-mix(in srgb, var(--accent) 40%, transparent);filter:brightness(1.1);}

  .teamline{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);margin-bottom:14px;text-align:right;}
  .teamline button{background:none;border:none;color:var(--accent-strong);cursor:pointer;font-family:inherit;font-size:inherit;text-decoration:underline;padding:0;transition:filter .15s ease;}
  .teamline button:hover,.teamline button:active{filter:brightness(1.3);}

  /* bridge / final */
  .bridge{text-align:center;}
  .bridge .badge{
    display:inline-block;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12px;
    letter-spacing:.1em;color:var(--tier-color);border:1.5px solid var(--tier-color);border-radius:20px;
    padding:5px 16px;margin-bottom:14px;text-transform:uppercase;
  }
  .bridge h2{font-family:'IBM Plex Mono',monospace;font-size:17px;margin-bottom:12px;}
  .bridge p{color:var(--ink);font-size:14.5px;margin-bottom:20px;text-align:left;}
  .prize{background:color-mix(in srgb, var(--gold) 16%, transparent);border:1px solid var(--gold);color:var(--gold);border-radius:6px;padding:10px 14px;font-family:'IBM Plex Mono',monospace;font-size:13px;margin-bottom:16px;}

  /* leaderboard */
  .lbrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
  .lbrow:last-child{border-bottom:none;}
  .lbname{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;}
  .lbrank{font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.06em;}
  .lbtime{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-dim);text-align:right;}
  .segbar{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;height:5px;}
  .seg{border-radius:2px;background:var(--surface-alt);}
  .seg.on{background:var(--tier-color);}
  .empty{text-align:center;color:var(--ink-dim);font-size:13px;padding:30px 0;}

  .admin{margin-top:26px;padding-top:16px;border-top:1px dashed var(--border);text-align:center;}
  .admin summary{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);cursor:pointer;letter-spacing:.05em;text-transform:uppercase;}
  .admin .btn{margin-top:10px;background:var(--alert);--tier-color:var(--alert);}

  .footer{text-align:center;margin-top:28px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:var(--ink-dim);text-transform:uppercase;}
  .status-pill{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-dim);text-align:center;margin-top:10px;}
</style>
</head>
<body>
<div id="app"><div class="status-pill">Booting terminal…</div></div>
<script>
(function(){
  "use strict";

  var API_URL = "https://script.google.com/macros/s/AKfycbxL1xYtcoHf8-OJ3F3ia3ju5DDfP-LzYG20Iu3KB3_r7v6wqJjudcBiJQm6YLtKNINcaw/exec";
  var POLL_MS = 1000;

  var HASHES = {
    1: "ec4d372a8d13184e79d303d9c207eed18816e770479c9956c392d5ebf0f29d67",
    2: "46e67c525617663b392a53c0e94ba79e62db62a851fb175ae87756d4e73c9718",
    3: "875d65840f6f360a64a737eb3c520a7e22bc1e3316ce5e61710b652bec16ec34",
    4: "bcb64e9c3e5165e2c29d77fbfb133b5fc3e7d3e2be50f782769e5202db0be148"
  };

  var LEVELS = {
    1: {
      rank: "Intern", tier: 1, inputLabel: "Override Code",
      briefing: "The Director has vanished without a trace. To find them, start where the numbers don't lie. Seek the preferred throne of the one who holds the keys to the treasure - stationed right beside the forgotten door that can no longer be opened.",
      footnote: "Before moving forward in your career, always take two steps back to reflect on where you started.",
      bridgeBadge: "Probation passed",
      bridgeTitle: "You are now an Intern Consultant",
      bridgeBody: "You've survived probation, but the Director is still nowhere in sight. Financial records show they recently audited four major company tools before disappearing. Seek the sacred corners where productivity goes to replenish when the afternoon slump hits — the ultimate battleground where healthy options and guilty pleasures live side by side."
    },
    2: {
      rank: "Junior", tier: 2, inputLabel: "4-Digit Passcode",
      briefing: "Seek the sacred corners where productivity goes to replenish when the afternoon slump hits - the ultimate battleground where healthy options and guilty pleasures live side by side.",
      clues: [
        "Google Chat team syncs happen <b>after</b> checking staffing assignments on Artefactory.",
        "Submitting timesheets on Everwin is <b>always the final step</b> before the weekend.",
        "Booking time off on Simployer must happen <b>before</b> checking Artefactory."
      ],
      rule: "Passcode digit = (sum of the outer 2 digits) − (sum of the inner 2 digits), for each app's number in sequence.",

      bridgeBody: "2017 is the year the international Artefact Group was created through the merger with Netbooster. You've proven your mastery over company history and daily workflows — workflows tamed, process aligned. You're officially Senior Rank. To reach the Senior Terminal, find this truth: wisdom is not written on walls — it rests quietly beneath the seat of the seeker."
    },
    3: {
      rank: "Senior", tier: 3, inputLabel: "11-Character Passcode",
      steps: [
        {
          heading: "Resolve the unknown 'X'",
          intro: "Identify your starting coordinate before touching the wheel:",
          quote: "\"I hide inside the word that means to labor for a wage,\nand again inside the word that means the room where such labor is done,\nand a third time inside the word that names the reason you gather here tonight.\nThree times I appear, three times unnoticed.\"",
          outro: "Locate this <b>letter</b> on the 5×5 Matrix at the wheel's center."

        {

          intro: "Turn the wheel accordingly to each core value in sequence and gather the windows:",
          list: [
            "<b>\"CLIENT TRUST\"</b> ==&gt; 1, 2*, 3, 4",
            "<b>\"ALWAYS A WAY\"</b> ==&gt; 5*, 6, 7",
            "<b>\"WE LEARN EVERYDAY\"</b> ==&gt; 8, 9*, 10"
          ]
        }
      ],
      notice: {
        heading: "Signal modifier",
        items: [
          { term: "BLUE", desc: "Data stream is normal" },
          { term: "RED(*)", desc: "Data stream is inverted" }
        ]
      },
      footnote: "",
      bridgeBadge: "Senior clearance verified",
      bridgeTitle: "You've cracked the system",
      bridgeBody: "You've claimed the codes. On paper, you're ready for Director — but rank isn't decrypted, it's defended. Return to where your very first door opened at Artefact, where every new face is welcomed before they belong. Find Stormy there. Only when Stormy signs off will the final Director hint be released."
    },
    4: {
      rank: "Director", tier: 4, inputLabel: "Director Command",
      verse: "A trailblazer spirit is winning this race,\nWith a strong alliance to keep up the pace!\nWe show up with purpose and big work to do,\nSharing wisdom along with a bad joke or two.\nMake an impact so huge that the whole office cheers,\nKeep the movement alive through the ultimate years!\nTo finish the hunt, go where people read,\n\"It Ends with Us\" is the story you need.",
      briefing: "Collect the six clue slips hidden in the meeting booths named above, then find the cipher key and worksheet tucked inside “It Ends with Us” on the office bookshelf. Map every collected character into position to reveal where the Director is hiding.",
      footnote: "",
      bridgeBadge: "Case closed",
      bridgeTitle: "You've found the Missing Director",
      bridgeBody: "Head to the room you just decoded and toast the new leadership."
    }
  };

  var APP_EL = document.getElementById("app");

  var state = { teams: {} };
  var apiStatus = "connecting"; // connecting | ready | error
  var busy = false;
  var view = "auto"; // auto | leaderboard

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function normalize(s){ return String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, ""); }
  function normalizeTeamName(s){ return String(s || "").trim().slice(0, 40).toUpperCase(); }

  function sha256Hex(str){
    var enc = new TextEncoder().encode(str);
    return crypto.subtle.digest("SHA-256", enc).then(function(buf){
      var bytes = new Uint8Array(buf), hex = "";
      for (var i = 0; i < bytes.length; i++){ hex += bytes[i].toString(16).padStart(2, "0"); }
      return hex;
    });
  }

  var memoryTeam = ""; // in-memory fallback for when storage access throws/is blocked
  function myTeamName(){ try { return localStorage.getItem("domibo_team") || memoryTeam; } catch(e){ return memoryTeam; } }
  function setMyTeamName(n){ memoryTeam = n; try { localStorage.setItem("domibo_team", n); } catch(e){} }
  function clearMyTeamName(){ memoryTeam = ""; try { localStorage.removeItem("domibo_team"); } catch(e){} }

  function getTeam(st, name){
    return (st.teams && st.teams[name]) || { level: 1, history: [] };
  }

  function cloneState(st){ return JSON.parse(JSON.stringify(st)); }

  function tierColorVar(tier){
    return "var(--tier" + tier + ")";
  }

  // --- durable write queue ---
  //
  // The backend (apps-script.gs) is the actual authority on level progress —
  // it validates the answer itself and owns every timestamp, so a submit
  // here is a *request*, not a fact, until the server confirms it. A failed
  // or dropped POST must never silently and permanently lose a team's
  // progress, so every attempted write is persisted to localStorage (not
  // sessionStorage — this must survive a closed tab/app, not just a reload)
  // before it's ever sent, and retried on every poll tick until the server's
  // own reported level shows it's no longer needed.

  var pendingWrite = loadPendingWrite();
  var pendingWriteInFlight = false;

  function loadPendingWrite(){
    try { var raw = localStorage.getItem("domibo_pending_write"); return raw ? JSON.parse(raw) : null; } catch(e){ return null; }
  }
  function savePendingWrite(pw){ try { localStorage.setItem("domibo_pending_write", JSON.stringify(pw)); } catch(e){} }
  function clearPendingWrite(){ pendingWrite = null; try { localStorage.removeItem("domibo_pending_write"); } catch(e){} }

  // Seed a synthetic optimistic entry for a not-yet-confirmed write so the
  // right screen shows immediately (including right after a reload), rather
  // than waiting on a network round trip.
  function seedOptimisticFromPending(){
    if (!pendingWrite) return;
    if (!state.teams) state.teams = {};
    var existing = state.teams[pendingWrite.team];
    if (!existing || existing.level < pendingWrite.targetLevel){
      var hist = (existing && existing.history || []).concat([{level: pendingWrite.targetLevel, at: new Date().toISOString()}]);
      state.teams[pendingWrite.team] = { level: pendingWrite.targetLevel, history: hist };
    }
  }

  function applyServerResult(team, res){
    if (!state.teams) state.teams = {};
    var existing = state.teams[team];
    // Never let an arriving confirmation regress what's already shown: if a
    // second submit fired while the first was still in flight (both allowed,
    // since a superseded in-flight write's own .then still applies its result
    // rather than silently dropping it — see sendPendingWrite), the SECOND
    // one's optimistic/confirmed level can already be ahead of this OLDER
    // response by the time it arrives.
    if (existing && existing.level > res.level) return;
    state.teams[team] = { level: res.level, history: res.history || [] };
  }

  function sendPendingWrite(){
    if (!pendingWrite || pendingWriteInFlight) return;
    pendingWriteInFlight = true;
    var myPW = pendingWrite; // capture identity — the global slot can move on (e.g. a team switch) before this resolves
    var team = myPW.team;
    var body = myPW.type === "create-team"
      ? { action: "create-team", team: team }
      : { action: "advance", team: team, answer: myPW.answer };
    postAction(body).then(function(res){
      pendingWriteInFlight = false;
      if (pendingWrite !== myPW){
        // a different write has since become the current one — still record
        // this team's confirmed result (don't lose it), just don't touch the
        // pendingWrite slot/localStorage, which now belongs to that other write.
        if (res && res.ok) applyServerResult(team, res);
        render();
        return;
      }
      if (res && res.ok){
        applyServerResult(team, res);
        clearPendingWrite();
      } else if (res && res.error === "wrong answer"){
        // state genuinely diverged from what this attempt assumed (e.g. answered
        // from a stale screen) — drop the stale retry; the next poll's fetched
        // state is the truth to show instead of re-attempting forever.
        clearPendingWrite();
      }
      // any other failure: leave pendingWrite in place, the next poll retries it
      render();
    }).catch(function(){ pendingWriteInFlight = false; });
  }

  // Called after every successful poll with the RAW (pre-merge) server
  // response: converge or retry. This must NOT look at the merged `state` —
  // mergeServerState() overlays our own optimistic guess back on top of
  // whatever the server actually said whenever the server hasn't caught up
  // yet, so checking the merged state here would just compare our optimism
  // against itself and always conclude "already done," silently dropping
  // the retry without ever actually sending it.
  function retryPendingWriteIfStale(rawServerData){
    if (!pendingWrite) return;
    var teams = (rawServerData && rawServerData.teams) || {};
    var serverTeam = teams[pendingWrite.team];
    var serverLevel = serverTeam ? serverTeam.level : 0;
    if (serverLevel >= pendingWrite.targetLevel){
      clearPendingWrite(); // this write (or an equivalent one from another device) already landed
      return;
    }
    if (pendingWrite.type === "advance" && serverLevel !== pendingWrite.targetLevel - 1){
      clearPendingWrite(); // state moved in a way this stale attempt can't safely resolve (e.g. a reset)
      return;
    }
    sendPendingWrite();
  }

  seedOptimisticFromPending();

  // --- backend sync (Google Apps Script Web App over a Google Sheet) ---

  function mergeServerState(serverState){
    var merged = serverState && serverState.teams ? cloneState(serverState) : { teams: {} };
    if (pendingWrite && pendingWrite.team){
      var team = pendingWrite.team;
      var serverLevel = (merged.teams[team] && merged.teams[team].level) || 0;
      if (serverLevel < pendingWrite.targetLevel && state.teams && state.teams[team]){
        merged.teams[team] = state.teams[team]; // keep our optimistic overlay until the server catches up
      }
    }
    return merged;
  }

  var hasBooted = false;          // true once the very first fetchState() has settled, success or failure
  var hasRenderedSuccessOnce = false; // true only once a fetchState() has actually SUCCEEDED and been rendered

  // Polling re-renders the whole page via innerHTML, which would blow away
  // (and on mobile, dismiss the keyboard for) an input the user is actively
  // using. A focus check isn't reliable enough to guard against that —
  // autocorrect/predictive-text/autocapitalize on mobile keyboards can shift
  // focus away from the input for a moment in ways a poll can land in. The
  // team-select and puzzle-answer screens only ever show *this* team's own
  // progress anyway (never changes from another device), so there's no
  // reason for polling to touch that DOM at all — only the leaderboard
  // actually needs to redraw on every tick.
  function renderIfNeeded(isSuccess){
    if (isSuccess){
      if (!hasRenderedSuccessOnce){
        // Render once on the very first success, however many failures came
        // before it — this is what populates the "resume an existing team"
        // chip list and clears any lingering connection-error message.
        hasBooted = true; hasRenderedSuccessOnce = true; render();
        return;
      }
      if (view === "leaderboard") render();
      return;
    }
    if (!hasBooted){ hasBooted = true; render(); }
    else if (view === "leaderboard") render();
  }

  function fetchState(){
    return fetch(API_URL, { method: "GET" })
      .then(function(res){ if (!res.ok) throw new Error("bad status"); return res.json(); })
      .then(function(data){
        retryPendingWriteIfStale(data); // check against the raw response, before it's merged with our own overlay
        state = mergeServerState(data);
        apiStatus = "ready";
        renderIfNeeded(true);
      })
      .catch(function(){
        apiStatus = "error";
        renderIfNeeded(false);
      });
  }

  function postAction(body){
    return fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(body)
    }).then(function(res){
      if (!res.ok) throw new Error("bad status");
      return res.json();
    });
  }

  // Self-rescheduling, not setInterval: the next poll is only scheduled once
  // THIS one has fully settled (fetchState()'s internal .catch means its
  // returned promise always fulfills, success or failure), so overlapping
  // in-flight requests are impossible even if one poll runs long.
  function pollLoop(){
    fetchState().then(function(){ setTimeout(pollLoop, POLL_MS); });
  }

  function startPolling(){
    pollLoop();
    if (pendingWrite) sendPendingWrite(); // don't wait a full poll cycle to retry a write left over from before a reload
  }

  // --- game actions ---

  function submitTeamName(name){
    name = normalizeTeamName(name);
    if (!name) return;
    setMyTeamName(name);
    if (state.teams && state.teams[name]){ render(); return; } // already known locally, nothing to send
    pendingWrite = { type: "create-team", team: name, targetLevel: 1 };
    savePendingWrite(pendingWrite);
    seedOptimisticFromPending();
    render();
    sendPendingWrite();
  }

  function submitAnswer(levelNum, raw){
    var team = myTeamName();
    if (!team || busy) return;
    busy = true; window.__domiboLastError = null; render();
    var norm = normalize(raw);
    sha256Hex(norm).then(function(hex){
      busy = false;
      if (hex !== HASHES[levelNum]){
        window.__domiboLastError = "ACCESS DENIED — that code doesn't match. Double-check the physical clue and try again.";
        render();
        return;
      }
      var t = getTeam(state, team);
      if (t.level !== levelNum){ render(); return; } // stale UI guard
      var toLevel = levelNum + 1;
      pendingWrite = { type: "advance", team: team, answer: norm, targetLevel: toLevel };
      savePendingWrite(pendingWrite);
      seedOptimisticFromPending();
      try { sessionStorage.setItem("domibo_pending", JSON.stringify({team: team, toLevel: toLevel})); } catch(e){}
      render();
      sendPendingWrite();
    });
  }

  function resetAll(){
    var key = window.prompt("Facilitator PIN to reset all teams:");
    if (key === null) return; // cancelled
    postAction({ action: "reset", adminKey: key }).then(function(res){
      if (res && res.ok){
        state = { teams: {} };
        clearMyTeamName();
        clearPendingWrite();
        try { sessionStorage.removeItem("domibo_pending"); } catch(e){}
        render();
        fetchState();
      } else {
        window.__domiboLastError = "Wrong PIN — reset cancelled.";
        render();
      }
    }).catch(function(){
      window.__domiboLastError = "Couldn't reach the server to reset — check your connection.";
      render();
    });
  }

  function fmtElapsed(iso){
    if (!iso) return "—";
    var s = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime())/1000));
    var m = Math.floor(s/60); var sec = s % 60;
    return m + "m " + String(sec).padStart(2,"0") + "s ago";
  }

  function renderLadder(currentLevel){
    var names = ["Intern","Junior","Senior","Director"];
    var html = '<div class="ladder">';
    for (var i=1;i<=4;i++){
      var cls = i < currentLevel ? "done" : (i === currentLevel ? "now" : "");
      html += '<div class="node ' + cls + '" style="--tier-color:' + tierColorVar(i) + '"><div class="bar"></div><div class="dot"></div><div class="label">' + names[i-1] + '</div></div>';
    }
    html += '</div>';
    return html;
  }

  function renderTopbar(){
    var html = '<div class="topbar"><div class="wordmark">THE MISSING DIRECTOR<small>Artefact Benelux · Promotion Assessment</small></div>';
    html += '<button class="iconbtn" data-action="toggle-leaderboard">' + (view === "leaderboard" ? "Console" : "Leaderboard") + '</button></div>';
    return html;
  }

  function renderTeamSelect(){
    var names = Object.keys(state.teams || {});
    var html = '<div class="teamcard">';
    html += '<h2>IDENTIFY YOUR TEAM</h2><p>Enter your team name to unlock Level 1.</p>';
    html += '<div class="field row"><input type="text" id="team-input" maxlength="40" placeholder="e.g. THE AUDITORS" autocomplete="off"><button class="btn" data-action="start-team">Enter</button></div>';
    if (names.length){
      html += '<div class="resume"><p>Or continue an existing team</p><div class="chiplist">';
      names.forEach(function(n){ html += '<button class="chip" data-action="resume-team" data-team="' + esc(n) + '">' + esc(n) + '</button>'; });
      html += '</div></div>';
    }
    html += '</div>';
    return html;
  }

  function renderLevelExtras(lvl, def){
    var html = "";
    if (def.verse) html += '<div class="verse">' + esc(def.verse) + '</div>';
    if (def.steps){
      def.steps.forEach(function(s, i){
        html += '<div class="stepblock">';
        html += '<div class="stepheading">Step ' + (i+1) + ': ' + esc(s.heading) + '</div>';
        if (s.intro){ html += '<div class="stepintro">' + esc(s.intro) + '</div>'; }
        if (s.quote){ html += '<div class="stepquote">' + esc(s.quote) + '</div>'; }
        if (s.list){
          html += '<div class="steplist">';
          s.list.forEach(function(item, idx){ html += '<div class="stepitem">' + (idx+1) + '. ' + item + '</div>'; });
          html += '</div>';
        }
        if (s.outro){ html += '<div class="stepoutro">' + s.outro + '</div>'; }
        html += '</div>';
      });
    }
    if (def.notice){
      html += '<div class="noticebox"><div class="noticehead">⚡ ' + esc(def.notice.heading).toUpperCase() + ':</div>';
      def.notice.items.forEach(function(it){
        html += '<div class="noticeitem">- <b>' + esc(it.term) + '</b>: ' + esc(it.desc) + '</div>';
      });
      html += '</div>';
    }
    if (def.grid){
      html += '<div class="grid6">';
      def.grid.forEach(function(row){ row.forEach(function(c){ html += '<div class="cell">' + esc(c) + '</div>'; }); });
      html += '</div>';
    }
    if (def.clues){
      html += '<div class="memo"><span class="stamp">Field notes</span><ul>';
      def.clues.forEach(function(c){ html += '<li>' + c + '</li>'; });
      html += '</ul></div>';
    }
    if (def.rule){ html += '<div class="rule">' + def.rule + '</div>'; }
    return html;
  }

  function renderLevel(levelNum){
    var def = LEVELS[levelNum];
    var err = window.__domiboLastError;
    var html = '<div class="console" style="--tier-color:' + tierColorVar(def.tier) + '">';
    html += '<div class="console-head center"><span class="lvtitle">LV' + levelNum + ' Terminal: ' + esc(def.rank) + '</span></div>';
    if (def.briefing){ html += '<div class="briefing">' + esc(def.briefing) + '</div>'; }
    html += renderLevelExtras(levelNum, def);
    html += '<div class="field"><label>' + esc(def.inputLabel) + '</label><div class="row"><input type="text" id="answer-input" autocomplete="off" autocapitalize="characters" placeholder="ENTER CODE"><button class="btn" data-action="submit-answer" data-level="' + levelNum + '" ' + (busy?'disabled':'') + '>' + (busy ? "Checking…" : "Submit") + '</button></div></div>';
    if (err){ html += '<div class="feedback error">' + esc(err) + '</div>'; }
    if (def.footnote){ html += '<div class="footnote">' + esc(def.footnote) + '</div>'; }
    html += '</div>';
    return html;
  }

  function isFirstToFinish(team){
    var teams = state.teams || {};
    var myFinishAt = null;
    var t = teams[team];
    if (!t || t.level < 5) return false;
    (t.history||[]).forEach(function(h){ if (h.level === 5) myFinishAt = h.at; });
    if (!myFinishAt) return false;
    var names = Object.keys(teams);
    for (var i=0;i<names.length;i++){
      if (names[i] === team) continue;
      var o = teams[names[i]];
      if (o.level >= 5){
        var oAt = null;
        (o.history||[]).forEach(function(h){ if (h.level === 5) oAt = h.at; });
        if (oAt && oAt < myFinishAt) return false;
      }
    }
    return true;
  }

  function renderBridgeOrFinal(levelJustSolved, team){
    var def = LEVELS[levelJustSolved];
    var isFinal = levelJustSolved === 4;
    var html = '<div class="console bridge" style="--tier-color:' + tierColorVar(def.tier) + '">';
    html += '<div class="badge">' + esc(def.bridgeBadge) + '</div>';
    html += '<h2>' + esc(def.bridgeTitle) + '</h2>';
    if (isFinal && isFirstToFinish(team)){
      html += '<div class="prize">🏆 You’re the first team to finish — find Stormy to claim your prize!</div>';
    }
    html += '<p>' + esc(def.bridgeBody) + '</p>';
    if (!isFinal){
      html += '<button class="btn" data-action="continue-level" data-level="' + (levelJustSolved+1) + '">Continue →</button>';
    } else {
      html += '<button class="iconbtn" data-action="toggle-leaderboard">View leaderboard</button>';
    }
    html += '</div>';
    return html;
  }

  function renderLeaderboard(){
    var teams = state.teams || {};
    var names = Object.keys(teams);
    var html = '<div class="console" style="--tier-color:var(--accent)"><div class="console-head"><span class="status">LIVE LEADERBOARD</span></div>';
    if (!names.length){
      html += '<div class="empty">No teams have started yet.</div>';
    } else {
      var rows = names.map(function(n){
        var t = teams[n];
        var lastAt = (t.history && t.history.length) ? t.history[t.history.length-1].at : null;
        return {name:n, level:t.level, lastAt:lastAt};
      });
      rows.sort(function(a,b){
        if (b.level !== a.level) return b.level - a.level;
        if (!a.lastAt) return 1; if (!b.lastAt) return -1;
        return a.lastAt < b.lastAt ? -1 : 1;
      });
      rows.forEach(function(r){
        var rankLabel = r.level >= 5 ? "Director — Found them!" : (LEVELS[r.level] ? LEVELS[r.level].rank : "Intern");
        html += '<div class="lbrow">';
        html += '<div><div class="lbname">' + esc(r.name) + '</div><div class="lbrank">' + esc(rankLabel) + '</div></div>';
        html += '<div class="lbtime">' + (r.lastAt ? fmtElapsed(r.lastAt) : "—") + '</div>';
        html += '<div class="segbar">';
        for (var i=1;i<=4;i++){
          var on = r.level > i || r.level >= 5;
          html += '<div class="seg ' + (on ? "on":"") + '" style="' + (on ? ("background:" + tierColorVar(Math.min(i,4))) : "") + '"></div>';
        }
        html += '</div></div>';
      });
    }
    var armed = Date.now() < resetArmedUntil;
    html += '<details class="admin"><summary>Facilitator tools</summary><button class="btn" data-action="arm-reset">' + (armed ? "Press again to confirm" : "Reset all teams") + '</button>';
    if (window.__domiboLastError){ html += '<div class="feedback error">' + esc(window.__domiboLastError) + '</div>'; }
    html += '</details>';
    html += '</div>';
    return html;
  }

  function renderStatusNote(){
    if (apiStatus === "connecting") return '<div class="status-pill">Connecting to the shared game state…</div>';
    if (apiStatus === "error") return '<div class="status-pill">Having trouble syncing — check your connection. Your progress is saved locally and will sync once reconnected.</div>';
    return "";
  }

  var resetArmedUntil = 0;

  function render(){
    var team = myTeamName();
    var html = "";
    html += renderTopbar();

    if (view === "leaderboard"){
      html += renderLeaderboard();
      html += renderStatusNote();
      APP_EL.innerHTML = html;
      bind();
      return;
    }

    if (!team){
      html += renderTeamSelect();
      html += renderStatusNote();
      APP_EL.innerHTML = html;
      bind();
      return;
    }

    var t = getTeam(state, team);
    html += '<div class="teamline">Team: <b>' + esc(team) + '</b> · <button data-action="switch-team">switch</button></div>';
    html += renderLadder(Math.min(t.level, 4));

    var pendingRaw = null;
    try { pendingRaw = sessionStorage.getItem("domibo_pending"); } catch(e){}
    var showBridge = false, bridgeLevel = null;
    if (pendingRaw){
      try {
        var p = JSON.parse(pendingRaw);
        if (p.team === team && t.level === p.toLevel){ showBridge = true; bridgeLevel = p.toLevel - 1; }
      } catch(e){}
    }

    if (t.level >= 5){
      html += renderBridgeOrFinal(4, team);
    } else if (showBridge && bridgeLevel){
      html += renderBridgeOrFinal(bridgeLevel, team);
    } else {
      html += renderLevel(t.level);
    }
    html += renderStatusNote();
    APP_EL.innerHTML = html;
    bind();
  }

  function bind(){
    APP_EL.querySelectorAll("[data-action]").forEach(function(el){
      el.addEventListener("click", function(){
        var action = el.getAttribute("data-action");
        if (action === "start-team"){
          var input = document.getElementById("team-input");
          submitTeamName(input ? input.value : "");
        } else if (action === "resume-team"){
          setMyTeamName(el.getAttribute("data-team"));
          render();
        } else if (action === "switch-team"){
          clearMyTeamName();
          try { sessionStorage.removeItem("domibo_pending"); } catch(e){}
          render();
        } else if (action === "submit-answer"){
          var ai = document.getElementById("answer-input");
          submitAnswer(parseInt(el.getAttribute("data-level"), 10), ai ? ai.value : "");
        } else if (action === "continue-level"){
          try { sessionStorage.removeItem("domibo_pending"); } catch(e){}
          render();
        } else if (action === "toggle-leaderboard"){
          view = view === "leaderboard" ? "auto" : "leaderboard";
          render();
        } else if (action === "arm-reset"){
          if (Date.now() >= resetArmedUntil){
            resetArmedUntil = Date.now() + 4000;
            render(); // reflect "armed" immediately — a poll-triggered render mid-window
                      // recomputes from this same timestamp, so it can't silently un-arm
          } else {
            resetArmedUntil = 0;
            resetAll();
          }
        }
      });
    });
    var teamInput = document.getElementById("team-input");
    if (teamInput){ teamInput.addEventListener("keydown", function(e){ if (e.key === "Enter") submitTeamName(teamInput.value); }); }
    var answerInput = document.getElementById("answer-input");
    if (answerInput){ answerInput.addEventListener("keydown", function(e){ if (e.key === "Enter") { var lvl = getTeam(state, myTeamName()).level; submitAnswer(lvl, answerInput.value); } }); }
  }

  render();
  startPolling();
})();
</script>
</body>
</html>
